<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Symmetrie-Werkstatt</title>
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#1F2A33;--mut:#5C6B77;--line:#D5DDE3;--grid:#E3E9EE;--navy:#00578A;--navyL:#E1ECF3;--mag:#B5175E;--magL:#F7E3EC;--ok:#2E7D32;--okL:#E3F1E4;--warn:#B26A00;--warnL:#FFF1DB}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181D;--card:#1B242B;--ink:#E7EDF1;--mut:#9AA9B4;--line:#33414C;--grid:#26313A;--navy:#5DB0E6;--navyL:#1C3445;--mag:#F06CA5;--magL:#3A1E2B;--ok:#7CCB80;--okL:#1E3320;--warn:#F2B35B;--warnL:#3A2C14}}
:root[data-theme="dark"]{--bg:#12181D;--card:#1B242B;--ink:#E7EDF1;--mut:#9AA9B4;--line:#33414C;--grid:#26313A;--navy:#5DB0E6;--navyL:#1C3445;--mag:#F06CA5;--magL:#3A1E2B;--ok:#7CCB80;--okL:#1E3320;--warn:#F2B35B;--warnL:#3A2C14}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 6px;max-width:760px;margin:0 auto}
header h1{font-size:20px;margin:0}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
nav{display:flex;gap:6px;padding:8px 16px;max-width:760px;margin:0 auto;flex-wrap:wrap}
nav button{flex:1;min-width:120px}
main{max-width:760px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 2px rgba(0,0,0,.06)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:42px}
button.on{background:var(--navy);border-color:var(--navy);color:#fff}
button.primary{background:var(--mag);border-color:var(--mag);color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg button{min-width:0;padding:8px 6px;font-size:14px}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--card);border-radius:10px}
.hint{color:var(--mut);font-size:14px;margin:6px 0 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--navyL);color:var(--ink)}
.badge.m{background:var(--magL)}
label.tg{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0}
input[type=range]{width:100%}
.task{font-size:17px;margin:0 0 8px}
.fb{border-radius:12px;padding:12px;margin-top:10px}
.fb.ok{background:var(--okL)} .fb.no{background:var(--warnL)}
.big{font-size:56px;font-weight:800;line-height:1;color:var(--mag);text-align:center;margin:6px 0}
.fingers{text-align:center;font-size:15px;color:var(--mut)}
.score{font-size:14px;color:var(--mut)}
h2{font-size:17px;margin:0 0 8px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
</style>
</head>
<body>
<header>
  <h1>Symmetrie-Werkstatt</h1>
  <p>Lernen und Anwenden von Geometrie · Kongruenzabbildungen</p>
</header>
<nav id="nav">
  <button data-v="labor">Labor</button>
  <button data-v="ueben">Bildpunkt setzen</button>
</nav>
<main id="app"></main>
<p class="foot">Prototyp · GIMB, Universität Münster · keine Datenerhebung, Fortschritt nur in Ihrem Browser</p>

<script>
// ---------- Geometrie ----------
const V=(x,y)=>({x,y}), add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y, len=a=>Math.hypot(a.x,a.y), cross=(a,b)=>a.x*b.y-a.y*b.x, eq=(a,b,e=1e-6)=>len(sub(a,b))<e;
function reflect(P,A,B){const d=sub(B,A),t=dot(sub(P,A),d)/dot(d,d),F=add(A,mul(d,t));return add(F,sub(F,P));}
function rotate(P,Z,deg){const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r),q=sub(P,Z);return add(Z,V(q.x*c-q.y*s,q.x*s+q.y*c));}
const pointRefl=(P,Z)=>add(Z,sub(Z,P)), translate=(P,v)=>add(P,v);
function sideOf(P,A,B){return cross(sub(B,A),sub(P,A));}
function distLine(P,A,B){const d=sub(B,A);return Math.abs(cross(d,sub(P,A)))/len(d);}
function orient(T){return Math.sign(cross(sub(T[1],T[0]),sub(T[2],T[0])));}
const round=v=>V(Math.round(v.x*1e6)/1e6,Math.round(v.y*1e6)/1e6);

// ---------- SVG-Helfer ----------
let clipN=0;const R=7, NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function board(container){
  const s=el('svg',{viewBox:`${-R-.5} ${-R-.5} ${2*R+1} ${2*R+1}`});
  container.appendChild(s);
  const cp=el('clipPath',{id:'cl'+(++clipN)},el('defs',{},s));el('rect',{x:-R,y:-R,width:2*R,height:2*R},cp);
  const g=el('g',{transform:'scale(1,-1)','clip-path':`url(#cl${clipN})`},s);
  return {svg:s,g};
}
function drawGrid(g){
  for(let i=-R;i<=R;i++){
    el('line',{x1:i,y1:-R,x2:i,y2:R,stroke:css('--grid'),'stroke-width':i===0?.06:.035},g);
    el('line',{x1:-R,y1:i,x2:R,y2:i,stroke:css('--grid'),'stroke-width':i===0?.06:.035},g);
  }
}
function label(g,P,t,color,dx=.28,dy=.28,size=.55){
  const tx=el('text',{x:P.x+dx,y:-(P.y+dy),'font-size':size,fill:color,'font-weight':700,transform:'scale(1,-1)'},g);tx.textContent=t;return tx;
}
function lineThrough(g,A,B,attrs){const d=sub(B,A),k=40/len(d);const P1=sub(A,mul(d,k)),P2=add(A,mul(d,k));return el('line',Object.assign({x1:P1.x,y1:P1.y,x2:P2.x,y2:P2.y},attrs),g);}
function svgPoint(svg,evt){const p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return V(q.x,-q.y);}
const snap=(P,st=1)=>V(Math.max(-R,Math.min(R,Math.round(P.x/st)*st)),Math.max(-R,Math.min(R,Math.round(P.y/st)*st)));
function arrowHead(g,A,B,color,w=.07){
  el('line',{x1:A.x,y1:A.y,x2:B.x,y2:B.y,stroke:color,'stroke-width':w},g);
  const d=mul(sub(B,A),1/len(sub(B,A))),n=V(-d.y,d.x),h=.38;
  const p1=add(sub(B,mul(d,h)),mul(n,h*.5)),p2=sub(sub(B,mul(d,h)),mul(n,h*.5));
  el('polygon',{points:`${B.x},${B.y} ${p1.x},${p1.y} ${p2.x},${p2.y}`,fill:color},g);
}
function triangle(g,T,color,fill,dash){
  el('polygon',{points:T.map(p=>`${p.x},${p.y}`).join(' '),fill,stroke:color,'stroke-width':.09,'stroke-dasharray':dash||'none','stroke-linejoin':'round'},g);
}
// Umlaufsinn-Pfeil im Dreieck
function orientMark(g,T,color){
  const C=mul(add(add(T[0],T[1]),T[2]),1/3);const o=orient(T);
  const r=.42, a0=0, a1=o>0?270:-270, pts=[];
  for(let i=0;i<=18;i++){const a=(a0+(a1-a0)*i/18)*Math.PI/180;pts.push(add(C,V(r*Math.cos(a),r*Math.sin(a))));}
  el('polyline',{points:pts.map(p=>`${p.x},${p.y}`).join(' '),fill:'none',stroke:color,'stroke-width':.06},g);
  const B=pts[pts.length-1],A=pts[pts.length-2];arrowHead(g,A,add(B,mul(sub(B,A),.6)),color,.06);
}
function handle(g,P,color,r=.32){return el('circle',{cx:P.x,cy:P.y,r,fill:color,stroke:'#fff','stroke-width':.07,style:'cursor:grab'},g);}

// ---------- Abbildungen ----------
const TYPES={
  achse:{name:'Achsenspiegelung',short:'Achse'},
  dreh:{name:'Drehung',short:'Drehung'},
  punkt:{name:'Punktspiegelung',short:'Punkt'},
  versch:{name:'Verschiebung',short:'Verschieb.'},
  schub:{name:'Schubspiegelung',short:'Schub'}
};
function applyMap(m,P){
  if(m.t==='achse')return reflect(P,m.A,m.B);
  if(m.t==='dreh')return rotate(P,m.Z,m.w);
  if(m.t==='punkt')return pointRefl(P,m.Z);
  if(m.t==='schub')return translate(reflect(P,m.A,m.B),sub(m.B,m.A));
  return translate(P,sub(m.V1,m.V0));
}

// ---------- Labor ----------
const lab={t:'achse',A:V(-1,-5),B:V(1,5),Z:V(0,0),w:90,V0:V(-5,-5),V1:V(-2,-4),T:[V(2,1),V(5,1),V(3,4)],
  show:{lines:true,orient:true,hide:false}};
function viewLabor(app){
  app.innerHTML=`
  <div class="card">
    <div class="row seg" id="types"></div>
    <div id="bd" style="margin-top:10px"></div>
    <div id="ctl"></div>
    <div class="badges" id="badges"></div>
  </div>
  <div class="card">
    <label class="tg"><input type="checkbox" id="sl"> Verbindungen Punkt – Bildpunkt</label>
    <label class="tg"><input type="checkbox" id="so"> Umlaufsinn anzeigen</label>
    <label class="tg"><input type="checkbox" id="sh"> Bild verdecken (erst vorhersagen, dann aufdecken)</label>
    <p class="hint">Ziehen Sie die Ecken A, B, C und die blauen Griffe. Alles rastet auf Gitterpunkte ein.</p>
    <p class="hint" id="schubhint" style="display:none">Schubspiegelung: Spiegelung an g, verkettet mit einer Verschiebung um v parallel zu g. Die beiden Griffe legen g und zugleich v fest. Mit „Verbindungen“ sehen Sie grau das Zwischenbild nach der Spiegelung. Die Reihenfolge ist egal – probieren Sie aus, warum.</p>
  </div>`;
  const types=app.querySelector('#types');
  for(const k in TYPES){const b=document.createElement('button');b.textContent=TYPES[k].name;b.className=lab.t===k?'on':'';b.onclick=()=>{lab.t=k;if(k==='schub'&&len(sub(lab.B,lab.A))>6){lab.A=V(0,-1);lab.B=V(-4,-1);}viewLabor(app)};types.appendChild(b);}
  const ctl=app.querySelector('#ctl');
  if(lab.t==='dreh'){ctl.innerHTML=`<div class="row" style="margin-top:10px"><span style="min-width:120px">Drehwinkel: <b id="wv"></b></span><input type="range" id="w" min="-180" max="180" step="15"></div><p class="hint">Positive Winkel: gegen den Uhrzeigersinn.</p>`;
    const w=ctl.querySelector('#w');w.value=lab.w;w.oninput=()=>{lab.w=+w.value;draw()};}
  app.querySelector('#schubhint').style.display=lab.t==='schub'?'block':'none';
  for(const [id,key] of [['sl','lines'],['so','orient'],['sh','hide']]){const c=app.querySelector('#'+id);c.checked=lab.show[key];c.onchange=()=>{lab.show[key]=c.checked;draw()};}
  const {svg,g}=board(app.querySelector('#bd'));
  let drag=null;
  function draw(){
    g.innerHTML='';drawGrid(g);
    const nav=css('--navy'),mag=css('--mag');
    const T=lab.T, Tb=T.map(p=>applyMap(lab,p));
    // Abbildungs-Elemente
    if(lab.t==='achse'||lab.t==='schub'){lineThrough(g,lab.A,lab.B,{stroke:nav,'stroke-width':.08});label(g,lab.B,'g',nav,.3,-.1);}
    if(lab.t==='schub'){arrowHead(g,lab.A,lab.B,nav,.12);label(g,mul(add(lab.A,lab.B),.5),'v',nav,-.6,.2);
      if(!lab.show.hide&&lab.show.lines){const Tm=T.map(p=>reflect(p,lab.A,lab.B));triangle(g,Tm,css('--mut'),'none','.12 .12');}}
    if(lab.t==='dreh'||lab.t==='punkt'){label(g,lab.Z,'Z',nav,.3,.3);}
    if(lab.t==='versch'){arrowHead(g,lab.V0,lab.V1,nav,.09);label(g,mul(add(lab.V0,lab.V1),.5),'v',nav,.2,.3);}
    if(!lab.show.hide){
      if(lab.show.lines){
        T.forEach((P,i)=>{const Q=Tb[i];
          if(lab.t==='dreh'){el('line',{x1:lab.Z.x,y1:lab.Z.y,x2:P.x,y2:P.y,stroke:mag,'stroke-width':.035,'stroke-dasharray':'.15 .12'},g);el('line',{x1:lab.Z.x,y1:lab.Z.y,x2:Q.x,y2:Q.y,stroke:mag,'stroke-width':.035,'stroke-dasharray':'.15 .12'},g);}
          else el('line',{x1:P.x,y1:P.y,x2:Q.x,y2:Q.y,stroke:mag,'stroke-width':.04,'stroke-dasharray':'.15 .12'},g);});
      }
      triangle(g,Tb,mag,css('--magL'),'.25 .12');
      if(lab.show.orient)orientMark(g,Tb,mag);
      ['A′','B′','C′'].forEach((n,i)=>label(g,Tb[i],n,mag));
    }
    triangle(g,T,nav,css('--navyL'));
    if(lab.show.orient)orientMark(g,T,nav);
    ['A','B','C'].forEach((n,i)=>label(g,T[i],n,nav));
    // Griffe
    T.forEach((P,i)=>handle(g,P,nav,.24).dataset.h='T'+i);
    if(lab.t==='achse'||lab.t==='schub'){handle(g,lab.A,nav).dataset.h='A';handle(g,lab.B,nav).dataset.h='B';}
    if(lab.t==='dreh'||lab.t==='punkt')handle(g,lab.Z,nav).dataset.h='Z';
    if(lab.t==='versch'){handle(g,lab.V0,nav,.26).dataset.h='V0';handle(g,lab.V1,nav).dataset.h='V1';}
    // Eigenschaften
    const same=orient(T)===orient(Tb);
    let fix='';
    if(lab.t==='achse')fix='Fixpunkte: alle Punkte auf g (Fixpunktgerade)';
    else if(lab.t==='dreh')fix=(((lab.w%360)+360)%360===0)?'Drehung um 0°: Identität, alle Punkte fest':'Fixpunkt: nur Z';
    else if(lab.t==='punkt')fix='Fixpunkt: nur Z';
    else if(lab.t==='schub')fix='keine Fixpunkte; Fixgerade: nur g';
    else fix=eq(lab.V0,lab.V1)?'Nullvektor: Identität':'keine Fixpunkte';
    let extra='';
    if(lab.t==='versch'){const v=sub(lab.V1,lab.V0);extra=`<span class="badge">v = (${v.x} | ${v.y})</span>`;}
    if(lab.t==='schub'){const v=sub(lab.B,lab.A);extra=`<span class="badge">v = (${v.x} | ${v.y}), parallel zu g</span>`;}
    if(lab.t==='dreh')extra=`<span class="badge">${lab.w>0?'gegen den Uhrzeigersinn':lab.w<0?'im Uhrzeigersinn':'kein Drehsinn'}</span>`;
    app.querySelector('#badges').innerHTML=lab.show.hide?'<span class="badge m">Bild verdeckt – wo liegt A′? Erst überlegen, dann aufdecken.</span>':
      `<span class="badge ${same?'':'m'}">Orientierung ${same?'erhalten (gleichsinnig)':'umgekehrt (gegensinnig)'}</span><span class="badge">${fix}</span>${extra}`;
    if(lab.t==='dreh')app.querySelector('#wv').textContent=lab.w+'°';
  }
  svg.addEventListener('pointerdown',e=>{const h=e.target.dataset&&e.target.dataset.h;if(h){drag=h;svg.setPointerCapture(e.pointerId);e.preventDefault();}});
  svg.addEventListener('pointermove',e=>{if(!drag)return;const P=snap(svgPoint(svg,e));
    if(drag[0]==='T')lab.T[+drag[1]]=P;else{
      if(drag==='A'&&eq(P,lab.B))return; if(drag==='B'&&eq(P,lab.A))return; lab[drag]=P;}
    if(orient(lab.T)===0)return draw();
    draw();});
  const end=()=>{drag=null};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  draw();
}

// ---------- Aufgaben: Bildpunkt setzen ----------
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const inView=P=>Math.abs(P.x)<=R-1&&Math.abs(P.y)<=R-1;
function genTask(t){
  for(let k=0;k<500;k++){
    let m;
    if(t==='achse'){const A=V(ri(-3,3),ri(-3,3)),d=pick([V(1,0),V(0,1),V(1,1),V(1,-1),V(1,2),V(2,1)]);m={t,A,B:add(A,mul(d,2))};}
    if(t==='dreh'){m={t,Z:V(ri(-3,3),ri(-3,3)),w:pick([90,-90,180,90,-90])};}
    if(t==='punkt'){m={t,Z:V(ri(-3,3),ri(-3,3))};}
    if(t==='schub'){const A=V(ri(-3,3),ri(-3,3)),d=pick([V(1,0),V(0,1),V(1,1),V(1,-1)]),k=pick([2,3,-2,-3]);m={t,A,B:add(A,mul(d,k))};if(!inView(m.B))continue;}
    if(t==='versch'){const v=V(ri(-4,4),ri(-4,4));if(len(v)<2)continue;const V0=V(ri(-6,6-Math.max(0,v.x)),ri(-6,6-Math.max(0,v.y)));m={t,V0,V1:add(V0,v)};if(!inView(m.V1)||!inView(m.V0))continue;}
    const P=V(ri(-5,5),ri(-5,5));const Q=round(applyMap(m,P));
    if(!inView(Q)||eq(P,Q))continue;
    if(Math.abs(Q.x-Math.round(Q.x))>1e-6||Math.abs(Q.y-Math.round(Q.y))>1e-6)continue;
    if((t==='achse'||t==='schub')&&distLine(P,m.A,m.B)<1)continue;
    if((t==='dreh'||t==='punkt')&&len(sub(P,m.Z))<2)continue;
    return {m,P,Q};
  }
}
// Einordnung in A–D (A = richtig)
function classify(task,X){
  const {m,P,Q}=task,e=1e-6;
  if(eq(X,Q))return {k:'A',txt:'Richtig! Der Bildpunkt liegt genau richtig.'};
  if(m.t==='achse'){
    const d=sub(m.B,m.A), sP=sideOf(P,m.A,m.B), sX=sideOf(X,m.A,m.B);
    if(sP*sX>=0) return {k:'D',txt:'Ihr Punkt liegt auf derselben Seite von g wie P (oder auf g). Bei der Achsenspiegelung „springt“ der Punkt immer auf die andere Seite der Achse.'};
    if(Math.abs(dot(sub(X,P),d))<e) return {k:'B',txt:'Die Richtung stimmt: PP′ steht senkrecht auf g. Aber der Abstand nicht – P′ muss genauso weit von g entfernt sein wie P.'};
    if(Math.abs(distLine(X,m.A,m.B)-distLine(P,m.A,m.B))<e) return {k:'C',txt:'Der Abstand zu g stimmt, aber PP′ steht nicht senkrecht auf g. Typisch bei schrägen Achsen: Man spiegelt „waagerecht“ oder „senkrecht“ statt senkrecht zur Achse.'};
    return {k:'D',txt:'Weder Abstand noch Richtung passen. Denken Sie an beide Bedingungen: PP′ ⟂ g und g halbiert PP′.'};
  }
  if(m.t==='dreh'){
    if(eq(X,round(rotate(P,m.Z,-m.w))))return {k:'B',txt:'Falscher Drehsinn! Sie haben in die Gegenrichtung gedreht. Positiver Winkel = gegen den Uhrzeigersinn.'};
    if(Math.abs(len(sub(X,m.Z))-len(sub(P,m.Z)))<e)return {k:'C',txt:'Der Abstand zu Z stimmt (Sie sind auf dem richtigen Kreis), aber der Drehwinkel nicht. Messen Sie den Winkel ∠PZP′.'};
    return {k:'D',txt:'Der Abstand zu Z stimmt nicht. Bei einer Drehung bleibt jeder Punkt auf seinem Kreis um Z.'};
  }
  if(m.t==='punkt'){
    const col=Math.abs(cross(sub(P,m.Z),sub(X,m.Z)))<e&&dot(sub(P,m.Z),sub(X,m.Z))<0;
    if(col)return {k:'B',txt:'Die Richtung stimmt (P, Z, P′ auf einer Geraden), aber Z muss die Strecke PP′ halbieren.'};
    if(Math.abs(len(sub(X,m.Z))-len(sub(P,m.Z)))<e)return {k:'C',txt:'Der Abstand zu Z stimmt, aber P′ liegt nicht auf der Geraden PZ. Die Punktspiegelung ist eine Drehung um genau 180°.'};
    return {k:'D',txt:'Tipp: Gehen Sie von P zu Z – und dann denselben Weg noch einmal weiter.'};
  }
  if(m.t==='schub'){
    const v=sub(m.B,m.A), Pm=round(reflect(P,m.A,m.B));
    if(eq(X,Pm))return {k:'B',txt:'Nur gespiegelt – die Verschiebung um v fehlt. Eine Schubspiegelung besteht aus beidem.'};
    if(eq(X,round(sub(Pm,v))))return {k:'C',txt:'Gespiegelt, aber gegen die Richtung von v verschoben. Der Pfeil zeigt von A nach B.'};
    if(eq(X,round(add(P,v))))return {k:'D',txt:'Nur verschoben – die Spiegelung an g fehlt.'};
    return {k:'D',txt:'Tipp: Erst an g spiegeln, dann um v verschieben (oder umgekehrt – bei v parallel zu g kommt dasselbe heraus).'};
  }
  const v=sub(m.V1,m.V0);
  if(eq(X,round(sub(P,v))))return {k:'B',txt:'Gegenrichtung! Sie haben um −v verschoben. Der Pfeil zeigt von seinem Anfang zu seiner Spitze.'};
  if(Math.abs(len(sub(X,P))-len(v))<e)return {k:'C',txt:'Die Länge stimmt, aber die Richtung nicht. PP′ muss parallel und gleich gerichtet zu v sein.'};
  return {k:'D',txt:'Zählen Sie die Kästchen von v ab: so viele nach rechts/links und oben/unten – und dieselben Schritte von P aus.'};
}
const NUM={A:1,B:2,C:3,D:4};
const LIVE={
  'v14':{title:'Vorlesung 14 · Achsenspiegelung',task:{m:{t:'achse',A:V(0,-1),B:V(2,0)},P:V(4,-4)},cats:['1  richtig','2  PP′ senkrecht zu g, aber Abstand falsch','3  g halbiert PP′, aber nicht senkrecht (z. B. entlang der Kästchen)','4  anderes (z. B. auf derselben Seite von g)']},
  'v15':{title:'Vorlesung 15 · Drehung',task:{m:{t:'dreh',Z:V(-1,-1),w:90},P:V(3,1)},cats:['1  richtig','2  falscher Drehsinn','3  richtiger Kreis um Z, falscher Winkel','4  Abstand zu Z falsch']}
};
let score={n:0,ok:0};try{score=JSON.parse(localStorage.getItem('sw-score'))||score}catch(e){}
function saveScore(){try{localStorage.setItem('sw-score',JSON.stringify(score))}catch(e){}}
let uebT='achse';
function viewTask(app,live){
  let task, cfg=live?LIVE[live]:null;
  if(cfg){task=Object.assign({},cfg.task);task.Q=round(applyMap(task.m,task.P));}else task=genTask(uebT);
  let X=null, done=false;
  const m=task.m;
  const desc={achse:'Spiegeln Sie P an der Geraden g.',dreh:`Drehen Sie P um Z um ${m.w}°${Math.abs(m.w)===180?'':m.w>0?' (gegen den Uhrzeigersinn)':' (im Uhrzeigersinn)'}.`,punkt:'Spiegeln Sie P am Punkt Z.',versch:'Verschieben Sie P um den Vektor v.',schub:'Bilden Sie P mit der Schubspiegelung ab: Spiegelung an g und Verschiebung um v (parallel zu g).'}[m.t];
  app.innerHTML=`
  ${cfg?`<div class="card"><h2>${cfg.title}</h2><p class="hint">Erst selbst setzen – dann mit der Hand abstimmen.</p></div>`:
  `<div class="card"><div class="row seg" id="types"></div><p class="score" id="sc"></p></div>`}
  <div class="card">
    <p class="task">${desc} Tippen Sie auf den Gitterpunkt, an dem P′ liegt.</p>
    <div id="bd"></div>
    <div class="row" style="margin-top:10px"><button class="primary" id="chk" disabled>Prüfen</button>${cfg?'':'<button id="nx">Neue Aufgabe</button>'}</div>
    <div id="fb"></div>
  </div>`;
  if(!cfg){const types=app.querySelector('#types');for(const k in TYPES){const b=document.createElement('button');b.textContent=TYPES[k].name;b.className=uebT===k?'on':'';b.onclick=()=>{uebT=k;viewTask(app)};types.appendChild(b);}
    app.querySelector('#sc').textContent=score.n?`Bisher: ${score.ok} von ${score.n} im ersten Versuch richtig`:'Ihr Fortschritt wird nur in diesem Browser gespeichert.';
    app.querySelector('#nx').onclick=()=>viewTask(app);}
  const {svg,g}=board(app.querySelector('#bd'));
  function draw(reveal){
    g.innerHTML='';drawGrid(g);const nav=css('--navy'),mag=css('--mag');
    if(m.t==='schub'){lineThrough(g,m.A,m.B,{stroke:nav,'stroke-width':.08});arrowHead(g,m.A,m.B,nav,.12);label(g,mul(add(m.A,m.B),.5),'v',nav,-.6,.25);}
    if(m.t==='achse'){lineThrough(g,m.A,m.B,{stroke:nav,'stroke-width':.08});const L=add(m.B,mul(sub(m.B,m.A),1.2));label(g,inView(L)?L:m.B,'g',nav,.3,-.1);}
    if(m.t==='dreh'||m.t==='punkt'){el('circle',{cx:m.Z.x,cy:m.Z.y,r:.16,fill:nav},g);label(g,m.Z,'Z',nav,.25,.25);}
    if(m.t==='versch'){arrowHead(g,m.V0,m.V1,nav,.09);label(g,mul(add(m.V0,m.V1),.5),'v',nav,.2,.3);}
    el('circle',{cx:task.P.x,cy:task.P.y,r:.2,fill:nav},g);label(g,task.P,'P',nav);
    if(reveal){const Q=task.Q,ok=css('--ok');
      if(m.t==='achse'){el('line',{x1:task.P.x,y1:task.P.y,x2:Q.x,y2:Q.y,stroke:ok,'stroke-width':.05,'stroke-dasharray':'.15 .1'},g);}
      if(m.t==='dreh'){const r=len(sub(task.P,m.Z));el('circle',{cx:m.Z.x,cy:m.Z.y,r,fill:'none',stroke:ok,'stroke-width':.04,'stroke-dasharray':'.15 .1'},g);
        [task.P,Q].forEach(p=>el('line',{x1:m.Z.x,y1:m.Z.y,x2:p.x,y2:p.y,stroke:ok,'stroke-width':.05},g));}
      if(m.t==='punkt')el('line',{x1:task.P.x,y1:task.P.y,x2:Q.x,y2:Q.y,stroke:ok,'stroke-width':.05,'stroke-dasharray':'.15 .1'},g);
      if(m.t==='versch')arrowHead(g,task.P,Q,ok,.06);
      if(m.t==='schub'){const Pm=reflect(task.P,m.A,m.B);el('line',{x1:task.P.x,y1:task.P.y,x2:Pm.x,y2:Pm.y,stroke:ok,'stroke-width':.05,'stroke-dasharray':'.15 .1'},g);el('circle',{cx:Pm.x,cy:Pm.y,r:.13,fill:'none',stroke:ok,'stroke-width':.05},g);arrowHead(g,Pm,Q,ok,.06);}
      el('circle',{cx:Q.x,cy:Q.y,r:.22,fill:ok},g);label(g,Q,'P′',ok);}
    if(X){el('circle',{cx:X.x,cy:X.y,r:.24,fill:'none',stroke:mag,'stroke-width':.09},g);el('circle',{cx:X.x,cy:X.y,r:.08,fill:mag},g);if(!reveal||!eq(X,task.Q))label(g,X,'?',mag,.3,-.6);}
  }
  svg.addEventListener('pointerdown',e=>{if(done)return;X=snap(svgPoint(svg,e));app.querySelector('#chk').disabled=false;draw(false);});
  app.querySelector('#chk').onclick=()=>{
    if(!X||done)return;done=true;app.querySelector('#chk').disabled=true;
    const c=classify(task,X), fb=app.querySelector('#fb');
    if(cfg){
      fb.innerHTML=`<div class="fb ${c.k==='A'?'ok':'no'}"><div class="fingers">Ihre Zahl</div><div class="big">${NUM[c.k]}</div><div class="fingers">Hand hoch über den Kopf mit <b>${NUM[c.k]} ${NUM[c.k]===1?'Finger':'Fingern'}</b></div>
        <p class="hint" style="margin-top:10px">${cfg.cats.join('<br>')}</p><div class="row" style="margin-top:8px"><button id="rv">Lösung zeigen (nach der Abstimmung)</button></div><div id="ex"></div></div>`;
      draw(false);
      fb.querySelector('#rv').onclick=()=>{draw(true);fb.querySelector('#ex').innerHTML=`<p style="margin:10px 0 0">${c.txt}</p>`;fb.querySelector('#rv').remove();};
    }else{
      score.n++;if(c.k==='A')score.ok++;saveScore();
      fb.innerHTML=`<div class="fb ${c.k==='A'?'ok':'no'}"><b>${c.k==='A'?'Richtig':'Noch nicht'}</b><p style="margin:6px 0 0">${c.txt}</p></div>`;
      draw(true);app.querySelector('#sc').textContent=`Bisher: ${score.ok} von ${score.n} im ersten Versuch richtig`;
    }
  };
  draw(false);
}

// ---------- Routing ----------
function route(){
  const h=(location.hash||'#labor').slice(1), app=document.getElementById('app');
  document.querySelectorAll('#nav button').forEach(b=>b.className=(b.dataset.v===h)?'on':'');
  document.getElementById('nav').style.display=h.startsWith('live')?'none':'flex';
  if(h==='ueben')viewTask(app);
  else if(h.startsWith('live-')&&LIVE[h.slice(5)])viewTask(app,h.slice(5));
  else viewLabor(app);
  window.scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.v});
window.addEventListener('hashchange',route);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',route);
route();
</script>
</body>
